services:
  app:
    depends_on:
      - redis
      - celerybeat
    env_file:
      - .env
    environment:
      - TZ=America/New_York
    # Production WSGI server. Overrides the base compose's `manage.py runserver`
    # (Django's dev server) which was the source of the original prod restart
    # loop and the "accessing the development server over HTTPS" errors.
    #
    # Worker class: gthread (NOT sync). Django's runserver runs threaded by
    # default, so handling N concurrent requests "just worked" — switching to
    # sync workers cut concurrency to `--workers` (3 here), which queued the
    # frontend's 6+ initial-load endpoints behind the workers, hit the timeout
    # mid-response, and SIGKILL'd. gthread gives `workers * threads` concurrency
    # (3 * 4 = 12) with no extra deps.
    #
    # 600s timeout (raised from 180s on 2026-06-15) matches nginx
    # proxy_read_timeout. Citywide custom searches with broad date windows
    # consistently take 3-10 minutes cold; at 180s the gthread SIGKILL fired
    # before the SQL completed, so the response never reached cache.set() and
    # the result was never cached — every retry hit the same cold-then-killed
    # cycle and the user saw the frontend "search timed out" message forever.
    # Aligning gunicorn to nginx lets the SQL finish, populate the 24h cache,
    # and make subsequent identical searches instant. Trade-off: one runaway
    # query holds a thread slot for up to 10 min (1/12 of capacity).
    # --max-requests/--max-requests-jitter: recycle each worker after handling
    # roughly N requests so accumulated per-worker memory (decompressed cache
    # values, ORM caches) is released. Jitter prevents all workers recycling
    # at the same time. Worker is gracefully shut + new one booted; in-flight
    # requests on the recycled worker complete normally.
    command: gunicorn app.wsgi:application --worker-class gthread --workers 3 --threads 4 --timeout 600 --max-requests 1000 --max-requests-jitter 100 --bind 0.0.0.0:8000 --access-logfile - --error-logfile -
    # TCP check on the gunicorn port — verifies a worker is listening. Avoids
    # an HTTP probe (which could hit auth-required endpoints or large payloads)
    # and avoids depending on curl being installed in the image.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket, sys; s=socket.socket(); s.settimeout(5); s.connect(('127.0.0.1', 8000)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
  # https://www.digitalocean.com/community/tutorials/how-to-secure-a-containerized-node-js-application-with-nginx-let-s-encrypt-and-docker-compose
  flower:
    image: mher/flower
    container_name: "flower"
    expose:
      - "8888"
    environment:
      - CELERY_BROKER_URL=redis://redis
      - FLOWER_PORT=8888
      - TZ=America/New_York
      - FLOWER_UNAPPLY_DJANGO_FIXUPS=true
    networks:
      - network1
      - nginx_network
    depends_on:
      - redis
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    command: celery flower --broker=redis://redis --port=8888
  nginx:
    restart: always
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "8888:8888"
    volumes:
      - ./nginx:/app/nginx
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - ../anhd-council-client/build_publish:/client
      - ../staging-anhd-council-client/build_publish:/staging-client
      - static_volume:/static
    environment:
      - TZ=America/New_York
    depends_on:
      - app
      - flower
    networks:
      - nginx_network
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''
  celery_default:
    restart: always
    build: .
    container_name: "celery_default"
    image: app_image
    networks:
      - network1
    links:
      - redis
    depends_on:
      - redis
      - celerybeat
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./celery:/app/celery
    env_file:
      - .env
    entrypoint: "celery -A app worker -E -Q celery -l debug -n celery_worker --concurrency=8 --logfile=./celery/logs/default.log"
    environment:
      - TZ=America/New_York
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  celery_update:
    restart: always
    build: .
    container_name: "celery_update"
    image: app_image
    networks:
      - network1
    depends_on:
      - redis
      - celerybeat
    volumes:
      - ./:/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./celery/logs:/app/celery/logs
    links:
      - redis
    env_file:
      - .env
    environment:
      - TZ=America/New_York
    entrypoint: "celery -A app worker -E -Q update -l debug -n update_worker --concurrency=8 --logfile=./celery/logs/update.log"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  celerybeat:
    restart: always
    build: .
    container_name: "celerybeat"
    image: app_image
    entrypoint: "celery -A app beat -l debug --scheduler django_celery_beat.schedulers:DatabaseScheduler --logfile=./celery/logs/beat.log"
    networks:
      - network1
    depends_on:
      - redis
    links:
      - redis
    environment:
      - TZ=America/New_York
    volumes:
      - ./:/app
      - ./celery:/app/celery
    env_file:
      - .env
    # https://www.distributedpython.com/2018/10/13/flower-docker/
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  certbot:
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    environment:
      - TZ=America/New_York
    command: sh -c "apk add --no-cache tzdata && cp /usr/share/zoneinfo/America/New_York /etc/localtime && echo 'America/New_York' > /etc/timezone && apk del tzdata"
