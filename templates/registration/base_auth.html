<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DAP Portal{% endblock %}</title>
  <style>
    :root {
      --dap-black: #212529;
      --dap-gray: #6c757d;
      --dap-border: #b9b8b8;
      --dap-primary: #007bff;
      --dap-orange: #f8a35e;
      --dap-white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--dap-black);
      background: #f5f5f5;
      line-height: 1.5;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--dap-white);
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      padding: 32px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .auth-card__brand {
      margin-bottom: 24px;
    }

    .auth-card__brand-title {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.02em;
    }

    .auth-card__brand-title span {
      color: var(--dap-primary);
    }

    .auth-card__subtitle {
      color: var(--dap-gray);
      font-size: 14px;
      margin: 8px 0 0;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 16px;
      font-weight: 700;
    }

    p, li {
      font-size: 14px;
      line-height: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--dap-border);
      border-radius: 0;
      font-size: 14px;
      margin-bottom: 16px;
    }

    input:focus {
      outline: 2px solid var(--dap-primary);
      border-color: var(--dap-primary);
    }

    .password-field {
      position: relative;
      margin-bottom: 16px;
    }

    .password-field input {
      margin-bottom: 0;
      padding-right: 72px;
    }

    .password-field__toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--dap-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 8px;
    }

    .btn-primary {
      display: inline-block;
      width: 100%;
      padding: 10px 16px;
      background: var(--dap-black);
      color: var(--dap-white);
      border: 0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    .btn-primary:hover {
      background: #000;
    }

    .auth-links {
      margin-top: 16px;
      font-size: 14px;
    }

    .auth-links a {
      color: var(--dap-primary);
    }

    .errorlist {
      color: #dc3545;
      list-style: none;
      padding: 0;
      margin: 0 0 12px;
      font-size: 14px;
    }

    .helptext {
      display: block;
      color: var(--dap-gray);
      font-size: 12px;
      margin: -8px 0 16px;
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__brand">
        <p class="auth-card__brand-title">DAP <span>PORTAL</span></p>
        <p class="auth-card__subtitle">Displacement Alert Project</p>
      </div>
      {% block content %}{% endblock %}
    </div>
  </div>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
