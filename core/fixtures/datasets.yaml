- model: core.dataset
  pk: 22
  fields:
    name: TaxBills Rent Stabilization Records
    model_name: RentStabilizationRecord
    automated: true
    update_instructions: 'Automated: monthly via celerybeat. Auto-discovers the
      latest JustFix "doffer" file (rentstab_counts_from_doffer_{year}.csv on
      justfix-data S3, the NYCDB rentstab_v2 source) by probing years newest-first,
      and auto-detects the latest year column — no MANUAL_YEAR to bump.

      Manual override: upload a CSV with ucbbl + uc{YEAR} columns via admin and
      run an update. Imports upsert, so prior years are preserved.

      Columns exist through uc2030; add fields + a migration to go beyond.

      After import the daily "annotate properties all" task refreshes
      unitsrentstabilized; the latest-year cache resets automatically on import.'
    download_endpoint: null
    api_last_updated: null
    records_start: null
    records_end: null
    update_schedule: when needed
    deprecated: false
