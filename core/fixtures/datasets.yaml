    model_name: RentStabilizationRecord
    automated: false
    update_instructions: '1) Download CSV from NYCDB ''rentstab_v2'' table (https://github.com/nycdb/nycdb).
      Ensure it has ucbbl and uc{YEAR} columns.

      2) In datasets/models/RentStabilizationRecord.py, change MANUAL_YEAR to the
      year being uploaded (currently 2023, 2024 data available).

      3) Columns up to uc2027 already exist — no migration needed unless uploading
      beyond 2027.

      4) Upload CSV via admin, create update for TaxBills Rent Stabilization Records.

      5) After import: run ''annotate properties all'' and ''Reset cache'' tasks at
      admin periodic tasks page.'
    download_endpoint: null
